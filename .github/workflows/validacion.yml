name: Validación de GESICOM

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, "feature/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gesicom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-bookworm
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: senova
          MYSQL_USER: gesicom_app
          MYSQL_PASSWORD: ci-app-password
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: "%"
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DJANGO_SECRET_KEY: clave-exclusiva-de-pruebas-automaticas-no-usar-en-produccion-2026
      DB_ENGINE: mysql
      DB_NAME: senova
      DB_USER: gesicom_app
      DB_PASSWORD: ci-app-password
      DB_MIGRATION_USER: gesicom_migraciones
      DB_MIGRATION_PASSWORD: ci-migration-password
      DB_TEST_USER: gesicom_pruebas
      DB_TEST_PASSWORD: ci-test-password
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bibliotecas de MySQL
        run: apt-get update && apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config default-mysql-client
      - name: Dependencias
        run: |
          python --version
          python -m pip install -r requirements-production.txt -r requirements-quality.txt
      - name: Cuentas de ejecución, migraciones y pruebas
        env:
          MYSQL_PWD: ci-root-password
        run: |
          python scripts/preparar_mysql.py --guardar-sql --con-pruebas
          mysql -h mysql -uroot < .local/mysql/perfiles.sql
          rm .local/mysql/perfiles.sql
      - name: Código y migraciones
        run: |
          ruff check .
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput --settings=SENNOVA.migration_settings
          python manage.py comprobar_base_datos --estricto
      - name: Pruebas con MySQL
        run: python manage.py test --settings=SENNOVA.test_settings --noinput
      - name: Configuración de producción y archivos estáticos
        env:
          DJANGO_DEBUG: "False"
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput
      - name: Dependencias de ejecución
        run: pip-audit --no-deps --disable-pip -r requirements-production.txt

  escritorio:
    name: Inicio local (${{ matrix.os }}, Python 3.15)
    strategy:
      fail-fast: false
      matrix:
        # cryptography 50 publica ruedas macOS para Apple Silicon.
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: GESICOM con espacios á
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: GESICOM con espacios á
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Configuración MySQL previa, sin servicios instalados
        run: python -c "from pathlib import Path; Path('.env').write_text('DB_ENGINE=mysql\nDJANGO_DEBUG=False\n', encoding='utf-8')"
      - name: Entorno incompleto de una instalación anterior
        run: python -c "from pathlib import Path; p=Path('.venv'); p.mkdir(); (p/'conservar.txt').write_text('entorno anterior', encoding='utf-8')"
      - name: Inicio sencillo sin herramientas de desarrollo ni servicios externos
        if: runner.os != 'Windows'
        run: python iniciar.py --preparar
      - name: Lanzador de Windows desde una ruta con espacios y tildes
        if: runner.os == 'Windows'
        run: .\INICIAR_WINDOWS.cmd --preparar
      - name: Respaldo del entorno anterior
        run: python -c "from pathlib import Path; r=list(Path('.local/entornos').glob('venv-*/conservar.txt')); assert len(r)==1 and r[0].read_text(encoding='utf-8')=='entorno anterior'"
      - name: Verificar ejecución mínima y runserver sin ajustes heredados
        run: python scripts/verificar_inicio_local.py --solo-ejecucion
      - name: Repetir preparación sin cambiar secretos ni cuentas
        run: python scripts/configurar_entorno.py --inicio-rapido
      - name: Pruebas del perfil, web y trabajador con caché compartida
        run: python scripts/verificar_inicio_local.py

  contenedor:
    name: Contenedor de producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir con el perfil MySQL y Gunicorn
        run: docker build --tag gesicom-ci .
      - name: Dependencias y bibliotecas nativas de ejecución
        run: |
          docker run --rm --entrypoint python gesicom-ci -m pip check
          docker run --rm --entrypoint python gesicom-ci -c "import django, MySQLdb, gunicorn, waitress; print('Django', django.get_version()); print('Cliente MySQL', MySQLdb.get_client_info())"
